    <text x="17" y="80" class="small">2b8d1a7f</text>
    <circle cx="94" cy="75" r="4" fill="#f4ca45"/>
    <text x="105" y="80" class="small">idle</text>
  </g>

  <g transform="translate(35 535)">
    <circle cx="19" cy="12" r="18" fill="#07233c" stroke="#0e8ed0"/>
    <path d="M11 13c6-8 11-9 16-4 5 5 4 10-4 16M27 11c-6 8-11 9-16 4-5-5-4-10 4-16" fill="none" stroke="#31f1ff" stroke-width="3" stroke-linecap="round"/>
    <text x="50" y="18" class="body">Lightweight bridge plugin</text>
    <text x="270" y="18" class="body muted">-</text>
    <text x="290" y="18" class="body">Telegram Bot x Codex CLI</text>
  </g>
</svg>
